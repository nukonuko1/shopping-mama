<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BB8F5"/>
      <stop offset="100%" stop-color="#A8D8F0"/>
    </linearGradient>
    <!-- Brick pattern -->
    <pattern id="brick" x="0" y="0" width="80" height="36" patternUnits="userSpaceOnUse">
      <rect width="80" height="36" fill="#F0EDE8"/>
      <!-- Row 1 bricks -->
      <rect x="1" y="1" width="76" height="16" rx="1" fill="#EDEAE4" stroke="#D8D4CE" stroke-width="0.5"/>
      <!-- Row 2 bricks (offset) -->
      <rect x="-38" y="19" width="76" height="16" rx="1" fill="#E8E5DF" stroke="#D8D4CE" stroke-width="0.5"/>
      <rect x="41" y="19" width="76" height="16" rx="1" fill="#EAE7E1" stroke="#D8D4CE" stroke-width="0.5"/>
    </pattern>
    <!-- Illustration board gradient -->
    <linearGradient id="board-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B9DC9"/>
      <stop offset="50%" stop-color="#E8921C"/>
      <stop offset="100%" stop-color="#C86090"/>
    </linearGradient>
    <!-- Blue oval gradient -->
    <linearGradient id="blue-oval" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4AAAD4"/>
      <stop offset="100%" stop-color="#1B5E8B"/>
    </linearGradient>
    <!-- Red oval gradient -->
    <linearGradient id="red-oval" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C84040"/>
      <stop offset="100%" stop-color="#8B2020"/>
    </linearGradient>
    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>

  <!-- === SKY === -->
  <rect width="800" height="900" fill="url(#sky)"/>

  <!-- Clouds -->
  <ellipse cx="120" cy="80" rx="60" ry="25" fill="white" opacity="0.7"/>
  <ellipse cx="160" cy="72" rx="45" ry="20" fill="white" opacity="0.7"/>
  <ellipse cx="90" cy="78" rx="35" ry="18" fill="white" opacity="0.7"/>
  <ellipse cx="650" cy="60" rx="70" ry="28" fill="white" opacity="0.5"/>
  <ellipse cx="700" cy="52" rx="50" ry="22" fill="white" opacity="0.5"/>

  <!-- === BUILDING FACADE === -->
  <!-- Main brick wall -->
  <rect x="60" y="120" width="680" height="750" fill="url(#brick)" rx="4"/>
  <!-- Building outline -->
  <rect x="60" y="120" width="680" height="750" fill="none" stroke="#CCCAC4" stroke-width="2" rx="4"/>

  <!-- Slightly lighter center panel -->
  <rect x="120" y="140" width="560" height="700" fill="rgba(255,255,255,0.08)" rx="2"/>

  <!-- === TOP SIGN: HAIR SALON === -->
  <rect x="180" y="145" width="440" height="64" rx="6" fill="rgba(245,242,238,0.95)" filter="url(#shadow-sm)"/>
  <text x="400" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="bold" letter-spacing="8" fill="#2A1A0D" opacity="0.85">HAIR SALON</text>

  <!-- === MAIN NAME: 銀座 === -->
  <text x="400" y="298" text-anchor="middle" font-family="'Noto Serif JP', serif" font-size="96" font-weight="900" fill="#1A1208" filter="url(#shadow-sm)" letter-spacing="16">銀座</text>

  <!-- === OVAL SIGNS === -->
  <!-- Blue oval: 理容室 -->
  <ellipse cx="220" cy="380" rx="108" ry="54" fill="url(#blue-oval)" filter="url(#shadow)"/>
  <ellipse cx="220" cy="380" rx="104" ry="50" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="220" y="393" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="32" font-weight="bold" fill="white" letter-spacing="4">理容室</text>

  <!-- Red/maroon oval: 美容室 -->
  <ellipse cx="580" cy="380" rx="108" ry="54" fill="url(#red-oval)" filter="url(#shadow)"/>
  <ellipse cx="580" cy="380" rx="104" ry="50" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="580" y="393" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="32" font-weight="bold" fill="white" letter-spacing="4">美容室</text>

  <!-- Oval connector/scissors decoration -->
  <path d="M330 365 Q400 340 470 365" stroke="#C0B8A8" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- === ILLUSTRATION BOARD === -->
  <!-- Board background (orange/yellow) -->
  <rect x="188" y="440" width="424" height="380" rx="8" fill="#E8921C" filter="url(#shadow)"/>

  <!-- Left blue section (man's background) -->
  <rect x="188" y="440" width="212" height="380" rx="8" fill="#5B9DC9"/>
  <!-- Overlap fix for corners -->
  <rect x="320" y="440" width="80" height="380" fill="#5B9DC9"/>
  <rect x="320" y="440" width="80" height="380" fill="#E8921C" clip-path="url(#right-half)"/>

  <!-- Dividing line -->
  <line x1="400" y1="440" x2="400" y2="820" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>

  <!-- Man silhouette (left side, facing right) -->
  <!-- Head -->
  <ellipse cx="290" cy="540" rx="52" ry="60" fill="white" opacity="0.95"/>
  <!-- Neck -->
  <rect x="272" y="592" width="36" height="30" fill="white" opacity="0.95"/>
  <!-- Shoulders -->
  <path d="M200 700 Q220 620 270 600 L310 600 Q360 620 380 680 L380 700 Z" fill="white" opacity="0.95"/>
  <!-- Hair (short, neat) -->
  <path d="M240 510 Q258 480 290 475 Q322 480 340 510 L338 530 Q310 518 290 520 Q270 518 242 530 Z" fill="#8B6040" opacity="0.8"/>
  <!-- Ear -->
  <ellipse cx="240" cy="548" rx="10" ry="14" fill="white" opacity="0.9"/>

  <!-- Comb (center) -->
  <rect x="385" y="520" width="30" height="100" rx="4" fill="#4A8AB0" opacity="0.9"/>
  <rect x="382" y="515" width="36" height="12" rx="2" fill="#5B9DC9" opacity="0.9"/>
  <!-- Comb teeth -->
  <rect x="386" y="525" width="4" height="80" rx="2" fill="white" opacity="0.7"/>
  <rect x="393" y="525" width="4" height="80" rx="2" fill="white" opacity="0.7"/>
  <rect x="400" y="525" width="4" height="80" rx="2" fill="white" opacity="0.7"/>
  <rect x="407" y="525" width="4" height="80" rx="2" fill="white" opacity="0.7"/>

  <!-- Woman silhouette (right side, facing left) -->
  <!-- Head -->
  <ellipse cx="510" cy="530" rx="50" ry="55" fill="rgba(255,255,255,0.92)"/>
  <!-- Long hair -->
  <path d="M460 520 Q450 580 455 680 Q470 720 490 740 L510 750 L530 740 Q550 720 565 680 Q570 580 560 520 Q540 500 510 495 Q480 500 460 520 Z" fill="#C060A0" opacity="0.85"/>
  <!-- Face overlay (lighter) -->
  <ellipse cx="510" cy="530" rx="44" ry="48" fill="rgba(255,255,255,0.92)"/>
  <!-- Neck -->
  <rect x="495" y="577" width="30" height="28" fill="rgba(255,255,255,0.92)"/>
  <!-- Shoulders -->
  <path d="M430 700 Q445 625 490 605 L530 605 Q575 625 590 700 L590 710 L430 710 Z" fill="rgba(255,255,255,0.92)"/>
  <!-- Scissors -->
  <g transform="translate(555, 580) rotate(-30)" fill="#D0A0C0" opacity="0.9">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#D0A0C0" stroke-width="3"/>
    <circle cx="20" cy="0" r="10" fill="none" stroke="#D0A0C0" stroke-width="3"/>
    <line x1="8" y1="6" x2="50" y2="30" stroke="#D0A0C0" stroke-width="3"/>
    <line x1="8" y1="-6" x2="50" y2="-30" stroke="#D0A0C0" stroke-width="3"/>
    <line x1="28" y1="6" x2="50" y2="30" stroke="#D0A0C0" stroke-width="3"/>
  </g>

  <!-- JINZA logo area at bottom of board -->
  <rect x="280" y="790" width="240" height="38" rx="4" fill="rgba(0,0,0,0.25)"/>
  <!-- Stylized G/J logo mark -->
  <text x="310" y="816" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="white" opacity="0.9">𝒢</text>
  <text x="330" y="816" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="white" opacity="0.9" letter-spacing="3">JINZA</text>

  <!-- Board border -->
  <rect x="188" y="440" width="424" height="380" rx="8" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="3"/>

  <!-- === AWNING (brown) at bottom === -->
  <rect x="60" y="850" width="680" height="50" rx="0" fill="#7A4E2D"/>
  <!-- Awning ridges -->
  <line x1="60" y1="865" x2="740" y2="865" stroke="#8B5E38" stroke-width="2"/>
  <line x1="60" y1="878" x2="740" y2="878" stroke="#6B3E20" stroke-width="1"/>
  <!-- Awning text -->
  <text x="400" y="882" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="rgba(255,255,255,0.85)" letter-spacing="5">HAIR SALON  銀 座</text>

  <!-- === SIDE SIGN (left) === -->
  <rect x="66" y="360" width="48" height="140" rx="4" fill="#1A1208" filter="url(#shadow-sm)"/>
  <rect x="70" y="364" width="40" height="132" rx="3" fill="#2A1E10"/>
  <!-- V mark -->
  <path d="M80 390 L90 415 L100 390" fill="none" stroke="#C8A060" stroke-width="3"/>
  <!-- Text -->
  <text x="90" y="445" text-anchor="middle" font-family="sans-serif" font-size="7" fill="rgba(200,160,96,0.7)" writing-mode="vertical-rl" letter-spacing="1">理容室　銀座</text>

  <!-- === BARBER POLE (far left) === -->
  <rect x="74" y="460" width="20" height="120" rx="4" fill="#E8E0D4"/>
  <!-- Stripes -->
  <path d="M74 470 L94 460 L94 478 L74 488 Z" fill="#CC2020" opacity="0.9"/>
  <path d="M74 488 L94 478 L94 496 L74 506 Z" fill="white" opacity="0.9"/>
  <path d="M74 506 L94 496 L94 514 L74 524 Z" fill="#1B5E8B" opacity="0.9"/>
  <path d="M74 524 L94 514 L94 532 L74 542 Z" fill="white" opacity="0.9"/>
  <path d="M74 542 L94 532 L94 550 L74 560 Z" fill="#CC2020" opacity="0.9"/>
  <!-- Pole cap -->
  <ellipse cx="84" cy="460" rx="12" ry="5" fill="#C0B8B0"/>
  <ellipse cx="84" cy="580" rx="12" ry="5" fill="#C0B8B0"/>
  <rect x="74" y="575" width="20" height="6" rx="2" fill="#C0B8B0"/>

  <!-- === TREE (left side) === -->
  <rect x="20" y="500" width="18" height="200" fill="#6B4020"/>
  <!-- Foliage -->
  <ellipse cx="40" cy="460" rx="70" ry="90" fill="#4A8A30" opacity="0.85"/>
  <ellipse cx="25" cy="480" rx="50" ry="70" fill="#5A9A38" opacity="0.75"/>
  <ellipse cx="55" cy="475" rx="55" ry="65" fill="#3A7A28" opacity="0.7"/>

</svg>
